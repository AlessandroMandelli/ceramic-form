<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#385849" />
    <meta
      name="description"
      content="Scheda ceramica di scavo: conteggi, osservazioni e schizzi, anche offline."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ceramic – Summary form</title>
    <link rel="stylesheet" href="./styles.css?v=1.1.0" />
    <script defer src="./pwa-install.js?v=1.1.0"></script>
    <script defer src="./bootstrap.js?v=1.1.0"></script>
    <script defer src="./app.bundle.js?v=1.1.0"></script>
  </head>
  <body>
    <main id="home" class="home">
      <button id="install" class="install secondary">Installa app</button>
      <div class="welcome">
        <div class="home-branding">
          <h1><span id="home-title">Ceramic</span></h1>
          <p><span id="home-subtitle">Summary form</span></p>
        </div>
        <div class="home-actions">
          <button id="new" type="button" disabled>Nuova scheda</button
          ><button id="import" type="button" class="secondary" disabled>
            Importa JSON
          </button>
        </div>
        <p id="home-status" class="home-status" role="status" hidden></p>
      </div>
    </main>
    <main id="form-view" hidden>
      <header class="app-header">
        <h1>Ceramic <span>– Summary form</span></h1>
      </header>
      <form id="record" autocomplete="off">
        <section class="card metadata" aria-label="Dati di scavo">
          <label
            >Excavation site:<input
              id="excavationSite"
              name="excavationSite"
              maxlength="300"
          /></label>
          <label>Area<input id="area" name="area" maxlength="300" /></label>
          <label
            >Strat. Unit<input id="stratUnit" name="stratUnit" maxlength="300"
          /></label>
          <label>Room<input id="room" name="room" maxlength="300" /></label>
        </section>
        <div class="columns">
          <section class="card fragments">
            <h2>Fragments</h2>
            <table>
              <colgroup>
                <col class="type-col" />
                <col />
                <col />
                <col />
                <col />
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">Type/Form</th>
                  <th scope="col">Rims</th>
                  <th scope="col">Handles</th>
                  <th scope="col">Feet</th>
                  <th scope="col">Bodies</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
            <button type="button" id="add-row" class="secondary add-row">
              Aggiungi riga
            </button>
          </section>
          <div class="right-column">
            <section class="card">
              <h2><label for="remarks">Fabric and remarks</label></h2>
              <textarea
                id="remarks"
                name="remarks"
                rows="4"
                placeholder="Scrivi le tue osservazioni…"
              ></textarea>
            </section>
            <section class="card sketch-card">
              <h2>Schizzo</h2>
              <button type="button" id="open-sketch" class="sketch-box">
                <img id="sketch-preview" alt="Schizzo salvato" hidden /><span
                  id="sketch-placeholder"
                  >Tocca per disegnare</span
                >
              </button>
              <p id="sketch-hint" class="hint" hidden>Tocca per modificare</p>
            </section>
          </div>
        </div>
        <footer class="actions">
          <button type="button" id="reset-sheet" class="secondary reset">
            Reset scheda
          </button>
          <div>
            <button type="button" id="json" class="secondary">
              Esporta JSON</button
            ><button type="button" id="pdf">Esporta PDF</button>
          </div>
        </footer>
      </form>
    </main>
    <input type="file" id="json-file" accept=".json,application/json" hidden />
    <dialog id="reset-dialog" class="confirm">
      <h2>Vuoi resettare la scheda?</h2>
      <p>Tutti i campi e lo schizzo saranno cancellati.</p>
      <div class="dialog-actions">
        <button id="reset-no" class="secondary" autofocus>No</button
        ><button id="reset-yes">Sì</button>
      </div>
    </dialog>
    <dialog id="install-dialog" class="confirm">
      <h2>Installa app</h2>
      <p id="install-help"></p>
      <div class="dialog-actions">
        <button id="install-close">Chiudi</button>
      </div>
    </dialog>
    <dialog
      id="sketch-dialog"
      class="sketch-editor"
      aria-labelledby="sketch-title"
    >
      <header>
        <h2 id="sketch-title">Schizzo</h2>
        <button id="save-sketch">Salva schizzo</button>
      </header>
      <div class="sketch-tools" role="toolbar" aria-label="Strumenti schizzo">
        <button id="undo" class="secondary">Annulla tratto</button
        ><button id="redo" class="secondary">Ripeti tratto</button
        ><button id="eraser" class="secondary" aria-pressed="false">
          Gomma</button
        ><button id="clear" class="secondary">Pulisci schizzo</button>
      </div>
      <div class="canvas-area">
        <canvas
          id="canvas"
          aria-label="Area per disegnare con penna, dito o mouse"
        ></canvas>
      </div>
      <div class="pen-tools">
        <label for="pen-size">Spessore penna</label
        ><input id="pen-size" type="range" min="1" max="10" value="2" /><output
          id="pen-value"
          for="pen-size"
          >2</output
        >
      </div>
    </dialog>
    <dialog id="clear-dialog" class="confirm">
      <h2>Cancellare tutto lo schizzo?</h2>
      <div class="dialog-actions">
        <button id="clear-no" class="secondary" autofocus>No</button
        ><button id="clear-yes">Sì</button>
      </div>
    </dialog>
    <noscript>Attiva JavaScript nel browser per compilare le schede.</noscript>
    <div
      id="status"
      role="status"
      aria-live="polite"
      class="toast"
      hidden
    ></div>
  </body>
</html>
